{% extends "base.html" %}

{% block title %}Contato - Operador Vitor{% endblock %}

{% block content %}
<section class="contato-container">
    <h1>SINAL_DE_CONTATO</h1>
    <p class="status-log">// STATUS: AGUARDANDO ENTRADA DE DADOS...</p>

    <form method="post" class="form-contato">
        <div class="campo">
            <label for="nome">IDENTIFICAÇÃO_OPERADOR</label>
            <input type="text" id="nome" name="nome" placeholder="SEU NOME" required>
        </div>

        <div class="campo">
            <label for="email">CANAL_DE_RESPOSTA</label>
            <input type="email" id="email" name="email" placeholder="EMAIL@EXEMPLO.COM" required>
        </div>

        <div class="campo">
            <label for="mensagem">TRANSMISSÃO_MENSAGEM</label>
            <textarea id="mensagem" name="mensagem" placeholder="DIGITE O COMANDO..."></textarea>
        </div>

        <button type="submit">TRANSMITIR SINAL</button>
    </form>
</section>
{% endblock %}
