{% extends "base.html" %}

{% block content %}
<div class="contato-wrapper">
    <h1>SINAL_DE_CONTATO</h1>
    
    <form method="post" class="form-contato">
        <div class="campo-grupo">
            <label for="nome">NOME:</label>
            <input type="text" id="nome" name="nome" placeholder="IDENTIFIQUE-SE" required>
        </div>

        <div class="campo-grupo">
            <label for="email">EMAIL:</label>
            <input type="email" id="email" name="email" placeholder="CANAL_DE_COMUNICACAO" required>
        </div>

        <div class="campo-grupo">
            <label for="mensagem">MENSAGEM:</label>
            <textarea id="mensagem" name="mensagem" placeholder="DIGITE O COMANDO..."></textarea>
        </div>

        <button type="submit" class="btn-doom">TRANSMITIR SINAL</button>
    </form>
</div>
{% endblock %}
