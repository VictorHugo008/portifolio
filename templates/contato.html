{% extends "base.html" %}

{% block content %}
<div class="contato-central">
    <h1 style="color: #e63946; font-size: 3rem; text-shadow: 0 0 10px #ff0000;">SINAL_DE_CONTATO</h1>
    
    {% if sucesso %}
        <p style="color: #00ff00; margin-bottom: 20px;">>> MENSAGEM TRANSMITIDA COM SUCESSO!</p>
    {% endif %}

    <form method="POST" class="form-doom">
        <label style="color: #e63946; text-align: left;">ID_OPERADOR:</label>
        <input type="text" name="nome" placeholder="Seu Nome" required>

        <label style="color: #e63946; text-align: left;">CANAL_RESPOSTA:</label>
        <input type="email" name="email" placeholder="seu@email.com" required>

        <label style="color: #e63946; text-align: left;">DADOS:</label>
        <textarea name="mensagem" rows="5" placeholder="Sua mensagem..." required></textarea>

        <button type="submit" class="btn-doom">TRANSMITIR SINAL</button>
    </form>
</div>
{% endblock %}
