{% extends "base.html" %}

{% block content %}
<div class="contato-central">
    <h1 class="titulo-doom">SINAL_DE_CONTATO</h1>
    
    {% if sucesso %}
        <div class="status-alerta">>> TRANSMISSÃO CONCLUÍDA.</div>
    {% endif %}

    <form method="POST" action="/contato" class="form-doom">
        <div class="campo">
            <label>ID_OPERADOR</label>
            <input type="text" name="nome" placeholder="NOME" required>
        </div>

        <div class="campo">
            <label>CANAL_FREQUENCIA</label>
            <input type="email" name="email" placeholder="EMAIL" required>
        </div>

        <div class="campo">
            <label>MENSAGEM_CRIPTOGRAFADA</label>
            <textarea name="mensagem" placeholder="DIGITE O COMANDO..." required></textarea>
        </div>

        <button type="submit" class="btn-doom">TRANSMITIR AGORA</button>
    </form>
</div>
{% endblock %}
