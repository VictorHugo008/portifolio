{% extends "base.html" %}

{% block content %}
<div class="contato-wrapper">
    <h1>SINAL_DE_CONTATO</h1>
    
    <form method="post" class="form-doom">
        <div class="input-group">
            <label>IDENTIFICAÇÃO_OPERADOR</label>
            <input type="text" name="nome" placeholder="SEU NOME" required>
        </div>

        <div class="input-group">
            <label>CANAL_DE_RESPOSTA</label>
            <input type="email" name="email" placeholder="EMAIL@EXEMPLO.COM" required>
        </div>

        <div class="input-group">
            <label>TRANSMISSÃO_MENSAGEM</label>
            <textarea name="mensagem" placeholder="DIGITE O COMANDO..."></textarea>
        </div>

        <button type="submit" class="btn-doom">TRANSMITIR SINAL</button>
    </form>
</div>
{% endblock %}
