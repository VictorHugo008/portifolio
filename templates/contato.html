{% extends "base.html" %}

{% block title %}Contato - Operador Vitor{% endblock %}

{% block content %}
<section class="contato-container">
    <h1 class="glitch-title">ENTRE EM CONTATO</h1>
    
    <form method="post" class="form-doom">
        <div class="input-group">
            <label for="nome">NOME:</label>
            <input type="text" id="nome" name="nome" placeholder="IDENTIFIQUE-SE" required>
        </div>

        <div class="input-group">
            <label for="email">EMAIL:</label>
            <input type="email" id="email" name="email" placeholder="CANAL_DE_COMUNICACAO" required>
        </div>

        <div class="input-group">
            <label for="mensagem">MENSAGEM:</label>
            <textarea id="mensagem" name="mensagem" placeholder="DIGITE O COMANDO..."></textarea>
        </div>

        <button type="submit" class="btn-doom">TRANSMITIR SINAL</button>
    </form>
</section>
{% endblock %}
